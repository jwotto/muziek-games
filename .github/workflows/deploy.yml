name: Deploy naar Vimexx

# Bij elke push naar main gaan de sitebestanden via FTP naar Vimexx. Pushen is
# dus publiceren; je hoeft nooit met de hand te FTP-en.
#
# EENMALIG INSTELLEN -- zet je Vimexx-FTP-gegevens als secrets in GitHub
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   FTP_SERVER    de FTP-hostnaam van Vimexx, bijvoorbeeld ftp.muziekfles.nl
#   FTP_USERNAME  je FTP-gebruikersnaam
#   FTP_PASSWORD  je FTP-wachtwoord
#
# Dit gaat uit van een eigen FTP-account voor dit domein, niet het hoofdaccount.
# Dat is met opzet: zo'n account kan alleen bij muziekfles.nl, dus een typefout
# in het pad hieronder kan studiowotto.com of technomaker.org nooit raken.
#
# server-dir is de map waar de site in moet, gerekend vanaf de plek waar je
# binnenkomt. Een FTP-account van het type 'domein' komt binnen in
# domains/muziekfles.nl/, en dan is public_html/ het goede pad. Heb je het als
# 'aangepast' aangemaakt en meteen op public_html gezet, dan sta je er al in en
# moet hier alleen / staan.
#
# Zie je na de eerste deploy niets op de site, dan zit je een map te hoog of te
# laag. Kijk met FileZilla waar je landt en pas deze ene regel aan.
#
# Deze actie houdt een bestandje .ftp-deploy-sync-state.json op de server bij en
# uploadt daarna alleen wat er veranderd is. De eerste keer duurt dus het langst
# (de map img is bij elkaar zo'n 5 MB), daarna gaat het snel.

on:
  push:
    branches: [main]
  workflow_dispatch:          # met de hand starten kan ook, via de Actions-tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Naar Vimexx via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          # Wat niet mee naar de live site gaat: git zelf en de werkbestanden.
          # De rest is de site, inclusief js/vendor/Tone.js -- die staat er met
          # opzet bij, zodat de les ook werkt als het internet in de klas hapert.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            huisstijl.md
