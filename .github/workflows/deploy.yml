name: Deploy naar Vimexx

# Bij elke push naar main gaan de sitebestanden via FTP naar Vimexx. Pushen is
# dus publiceren; je hoeft nooit met de hand te FTP-en.
#
# EENMALIG INSTELLEN -- zet je Vimexx-FTP-gegevens als secrets in GitHub
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#
#   FTP_SERVER    de FTP-hostnaam van Vimexx, bijvoorbeeld ftp.muziekfles.nl
#   FTP_USERNAME  je FTP-gebruikersnaam
#   FTP_PASSWORD  je FTP-wachtwoord
#
# server-dir hieronder is de map op Vimexx waar de site in moet, gerekend vanaf
# de plek waar je FTP-account binnenkomt. En dat verschilt per soort account:
#
#   het hoofdaccount (u158514p148271) komt binnen in je home-map, met daarin
#   domains/ voor al je domeinen samen -> domains/muziekfles.nl/public_html/
#
#   een FTP-account dat je speciaal voor dit domein aanmaakt komt al binnen in
#   domains/muziekfles.nl/ -> dan is public_html/ genoeg
#
# Het staat hieronder op het hoofdaccount. Controleer het pad even met FileZilla
# of de bestandsbeheerder van Vimexx voordat je de eerste keer draait: met het
# hoofdaccount kun je bij al je domeinen, dus een verkeerd pad zet deze site in
# de map van een andere site.
#
# Deze actie houdt een bestandje .ftp-deploy-sync-state.json op de server bij en
# uploadt daarna alleen wat er veranderd is. De eerste keer duurt dus het langst
# (de map img is bij elkaar zo'n 5 MB), daarna gaat het snel.

on:
  push:
    branches: [main]
  workflow_dispatch:          # met de hand starten kan ook, via de Actions-tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Naar Vimexx via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: domains/muziekfles.nl/public_html/
          # Wat niet mee naar de live site gaat: git zelf en de werkbestanden.
          # De rest is de site, inclusief js/vendor/Tone.js -- die staat er met
          # opzet bij, zodat de les ook werkt als het internet in de klas hapert.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            huisstijl.md
